<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>청년 정책 XAI 상담소</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        .fade-in { animation: fadeIn 0.3s ease-in; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        #chat-window::-webkit-scrollbar { width: 6px; }
        #chat-window::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
    </style>
</head>
<body class="bg-slate-50 h-screen flex flex-col font-sans text-slate-900">

    <header class="bg-white border-b px-6 py-4 flex items-center justify-between shadow-sm sticky top-0 z-10">
        <div class="flex items-center gap-3">
            <div class="w-10 h-10 bg-blue-600 rounded-xl flex items-center justify-center text-white shadow-md">
                <i class="fa-solid fa-comments-dollar text-lg"></i>
            </div>
            <h1 class="text-lg font-bold">청년 정책 XAI 상담소</h1>
        </div>
        <button id="reset-btn" class="px-3 py-2 bg-white hover:bg-slate-50 text-slate-600 rounded-lg text-xs font-bold border border-slate-200 shadow-sm transition-all active:scale-95">
            <i class="fa-solid fa-rotate-right"></i><span> 새 대화 시작</span>
        </button>
    </header>

    <main id="chat-window" class="flex-1 overflow-y-auto p-4 flex flex-col gap-6 items-start">
        <div class="flex justify-start items-start gap-3 w-full">
            <div class="w-8 h-8 rounded-full bg-blue-100 flex items-center justify-center text-blue-600 text-[10px] font-bold flex-shrink-0">AI</div>
            <div class="bg-white border p-3 px-4 rounded-2xl rounded-tl-none shadow-sm max-w-[80%] w-fit text-sm text-slate-700 leading-relaxed">
                안녕하세요! 어떤 정책 지원이나 금융 상품이 궁금하신가요? 상황을 말씀해 주시면 최적의 지원책을 분석해 드릴게요.
            </div>
        </div>
    </main>

    <footer class="p-4 bg-white border-t sticky bottom-0">
        <form id="chat-form" class="max-w-4xl mx-auto flex gap-2">
            <input type="text" id="user-input" autocomplete="off" placeholder="질문을 입력하세요..." 
                   class="flex-1 bg-slate-100 border-none rounded-xl px-5 py-3 text-sm focus:ring-2 focus:ring-blue-500 outline-none">
            <button type="submit" id="send-btn" class="bg-blue-600 text-white px-5 py-3 rounded-xl shadow-md active:scale-95 transition-all">
                <i class="fa-solid fa-paper-plane"></i>
            </button>
        </form>
    </footer>

    <script>
        const form = document.getElementById('chat-form');
        const input = document.getElementById('user-input');
        const chatWindow = document.getElementById('chat-window');
        const sendBtn = document.getElementById('send-btn');
        const resetBtn = document.getElementById('reset-btn');

        const sessionId = localStorage.getItem('chat_session_id') || (() => {
            const v = crypto.randomUUID();
            localStorage.setItem('chat_session_id', v);
            return v;
        })();

        form.onsubmit = async (e) => {
            e.preventDefault();
            const msg = input.value.trim();
            if (!msg) return;

            appendMessage('user', msg);
            input.value = '';
            sendBtn.disabled = true;
            const loadingId = appendMessage('bot', 'AI가 분석 중입니다...');

            try {
                const res = await fetch('/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ session_id: sessionId, message: msg })
                });
                const data = await res.json();
                updateMessage(loadingId, data.answer, data.xai_data);
            } catch (err) {
                updateMessage(loadingId, '서버 응답 오류가 발생했습니다.');
            } finally {
                sendBtn.disabled = false;
            }
        };

        resetBtn.onclick = () => { if(confirm("초기화할까요?")) location.reload(); };

        // [정석 DOM 생성 방식] 말풍선 크기 버그 해결
        function appendMessage(sender, text) {
            const id = Date.now();
            const isUser = sender === 'user';

            const row = document.createElement('div');
            row.id = id;
            // items-start가 위아래로 길어지는 버그를 차단합니다
            row.className = `flex ${isUser ? 'justify-end' : 'justify-start'} items-start gap-3 w-full fade-in`;

            if (!isUser) {
                const aiIcon = document.createElement('div');
                aiIcon.className = "w-8 h-8 rounded-full bg-blue-100 flex items-center justify-center text-blue-600 text-[10px] font-bold flex-shrink-0 shadow-sm";
                aiIcon.textContent = "AI";
                row.appendChild(aiIcon);
            }

            const bubble = document.createElement('div');
            // w-fit: 글자 수에 딱 맞춰 말풍선을 줄입니다
            bubble.className = `${isUser ? 'bg-blue-600 text-white rounded-tr-none' : 'bg-white border text-slate-700 rounded-tl-none'} p-3 px-4 rounded-2xl max-w-[75%] w-fit text-sm leading-relaxed whitespace-pre-wrap shadow-md`;
            bubble.textContent = text; 
            row.appendChild(bubble);

            if (isUser) {
                const meIcon = document.createElement('div');
                meIcon.className = "w-8 h-8 rounded-full bg-slate-800 text-white flex items-center justify-center text-[10px] font-bold flex-shrink-0 shadow-sm";
                meIcon.textContent = "ME";
                row.appendChild(meIcon);
            }

            chatWindow.appendChild(row);
            chatWindow.scrollTop = chatWindow.scrollHeight;
            return id;
        }

        function updateMessage(id, text, xaiData = null) {
            const row = document.getElementById(id);
            const bubble = row.querySelector('.w-fit');
            bubble.textContent = text;

            if (xaiData && xaiData.length > 0) {
                const xaiContainer = document.createElement('div');
                xaiContainer.className = "mt-4 pt-3 border-t border-slate-100";
                
                const title = document.createElement('p');
                title.className = "text-[10px] font-bold text-blue-500 mb-2 italic";
                title.innerHTML = '<i class="fa-solid fa-chart-line"></i> AI 기여도 분석';
                xaiContainer.appendChild(title);

                const badgeBox = document.createElement('div');
                badgeBox.className = "flex flex-wrap gap-1.5";
                
                xaiData.forEach(item => {
                    const badge = document.createElement('span');
                    badge.className = "bg-blue-50 text-blue-600 px-2 py-1 rounded-lg border border-blue-100 text-[9px] font-semibold";
                    badge.textContent = `#${item.word} ${item.score}%`;
                    badgeBox.appendChild(badge);
                });

                xaiContainer.appendChild(badgeBox);
                bubble.appendChild(xaiContainer);
            }
        }
    </script>
</body>
</html>
